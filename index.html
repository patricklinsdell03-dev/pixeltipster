<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixeltipster · Liverpool v Man City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#14162e;--s1:#1e2145;--s2:#272b57;--ln:#3b4180;--tx:#f4f1e4;--mu:#b3b6d9;--y:#ffd447;--g:#63e6ad;--k:#0b0c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,.px{font-family:'Pixelify Sans',monospace;margin:0;font-weight:500}
h1{font-size:28px;line-height:1.1}h2{font-size:19px}
.px{font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.sm{font-size:13px}.g{color:var(--g)}
.note{margin:0 -16px;padding:8px 16px;background:var(--k);font-size:13px;color:var(--mu)}
.card{background:var(--s1);border:2px solid var(--ln);box-shadow:4px 4px 0 var(--k);padding:14px 16px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;background:var(--s2);border:2px solid var(--ln);min-height:44px;padding:0 12px;transition:background .15s,color .15s,border-color .15s,opacity .15s}
button:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--ln);display:flex;flex-direction:column;gap:8px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;font-weight:600;font-size:14px}
.on{background:var(--y);color:var(--bg);border-color:var(--y)}
.row+.row{border-top:2px solid var(--s2)}
.rh{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;background:none;border:0;padding:10px 0;text-align:left}
.lab{display:flex;align-items:center;gap:8px;font-weight:600}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-left:20px}
.cell{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:400}
.cell .t{display:flex;justify-content:space-between;gap:6px}
.meter{display:block;height:6px;background:var(--s2)}
.meter i{display:block;height:100%;background:var(--mu)}
.hot .meter i{background:var(--g)}.hot b{color:var(--g)}
.fade{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.det{padding:0 0 14px 20px;display:flex;flex-direction:column;gap:16px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;padding:0}.step span{min-width:52px;text-align:center}
.chips{display:flex;gap:3px}
.chips i{flex:1;text-align:center;padding:4px 0;background:var(--s2);color:var(--mu);font-style:normal;font-size:13px}
.chips i.y{background:var(--g);color:var(--bg)}
.chips i.x{opacity:.25}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.box{padding:10px;background:var(--s2);font-size:14px}
.tw{transition:transform .15s;flex:none}.cl{transform:rotate(-90deg)}
.gm{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;width:100%;text-align:left;font-size:14px;margin-top:4px}
.gm.x{opacity:.45;text-decoration:line-through}
.pair,.notes{display:flex;flex-direction:column;gap:16px}
.r{text-align:right}
/* desktop: sidebar with fixture, strongest lines and games filter; wider rows with everything inline */
#app.wide{display:grid;grid-template-columns:340px minmax(0,1fr);gap:32px;max-width:1240px;padding:0 24px 40px;align-items:start}
.wide .side{position:sticky;top:0;max-height:100vh;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.wide .side .note{margin:0;padding:8px 0}
.wide main{display:flex;flex-direction:column;gap:14px;min-width:0}
.wide .top{margin:0;padding:12px 0}
.wide .top .pills{margin:0;padding:0}
.wide .gm{min-height:34px;font-size:13px;padding:0 10px}
.wrow{display:grid;grid-template-columns:200px 1fr 1fr;gap:24px;align-items:center}
.wrow .cell{gap:6px}.wrow .t{align-items:center;white-space:nowrap}
.whd{padding:10px 0;border-bottom:2px solid var(--s2)}
.wide .det{padding-left:224px}
.wide .pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.rh.prow,.prow{display:grid;grid-template-columns:minmax(0,1fr) 150px 50px 56px 140px 44px;gap:16px;align-items:center}
.wide .rh.prow{padding:12px 0}
.hits{display:flex;flex-direction:column;gap:4px}
.wide .notes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================================
   PIXELTIPSTER MATCH SHEET
   One page = one fixture. The page renders whatever is in DATA.
   In the live project the data job writes one DATA object per fixture
   (same shape as sample() returns) and this renderer stays unchanged.

   Team:  { name, code, games, groups:[{ name, stats }], players:[{ name, pos, mins, starts, stats }] }
   Game:  { date, opp, comp, ha:'H'|'A', score }   last 10, oldest first
   Stat:  { key, label, mode, vals, core?, venue?, opp? }
     mode  'over'  count stat, line is x.5 (team stats)
           'plus'  count stat, line is n+ (player stats)
           'yn'    1/0 per game      'form'  'W'/'D'/'L' per game
     vals  one per game, same order as games
     core  shown by default; the rest sit behind "Show more"
     venue per-game average at this venue, opp = what the opponent allows
   Both teams list the same groups and stats in the same order.
   ========================================================================== */
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const DATA = sample(), T = DATA.teams;
const S = { tab: 'Goals', pstat: 'sot', lines: {}, open: {}, more: {}, off: {}, comp: {}, filt: false };
const W = matchMedia('(min-width:1000px)');   // desktop layout
const REG = {};   // line id -> { st, ti }, filled on render so the +/- handler can find the stat
const TABS = ['Goals', 'Result', 'Shots', 'Corners', 'Cards', 'Players', 'Trends'];
const LEGEND = `<div class="sm mu">Last 10 games, oldest first. Green landed, faded is left out.</div>`;

const isCount = st => st.mode === 'over' || st.mode === 'plus';
const sel = ti => T[ti].games.map((g, i) => i).filter(i => !S.off[ti + '.' + i] && !S.comp[T[ti].games[i].comp]);
const pick = (st, ti) => sel(ti).map(i => st.vals[i]);
const baseLine = (st, v) => st.mode === 'over' ? Math.floor(avg(v)) + 0.5 : Math.max(1, Math.round(avg(v)));
const hitFn = (st, line) => st.mode === 'over' ? v => v > line : st.mode === 'plus' ? v => v >= line : st.mode === 'form' ? v => v === 'W' : v => v === 1;
const lineName = (st, line) => st.mode === 'over' ? 'Over ' + line : line + '+';
const lineShort = (st, line) => st.mode === 'over' ? 'O' + line : st.mode === 'plus' ? line + '+' : st.mode === 'form' ? 'Win' : 'Yes';
const lineOf = (id, st, ti) => isCount(st) ? (S.lines[id] ?? baseLine(st, pick(st, ti))) : null;
function rate(st, ti, line) {
  const v = pick(st, ti), f = hitFn(st, line), n = v.filter(f).length, l5 = v.slice(-5), n5 = l5.filter(f).length;
  return { v, f, n, N: v.length, n5, N5: l5.length, pct: v.length ? Math.round(100 * n / v.length) : 0, hot: v.length >= 5 && n / v.length >= 0.8 && n5 >= 4 };
}

/* ---------- rendering ---------- */
const chev = open => `<svg class="tw ${open ? '' : 'cl'}" viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="2,5 7,10 12,5"/></svg>`;
const meter = pct => `<span class="meter"><i style="width:${pct}%"></i></span>`;
const stepper = (id, st, line) => `<span class="step"><button data-a="line" data-id="${id}" data-d="-1" aria-label="Lower the line">-</button><span class="mono">${lineShort(st, line)}</span><button data-a="line" data-id="${id}" data-d="1" aria-label="Raise the line">+</button></span>`;

function cell(id, st, ti) {
  const c = rate(st, ti, lineOf(id, st, ti));
  return `<span class="cell ${c.hot ? 'hot' : ''}"><span class="t"><span><span class="mu">${T[ti].code}</span> ${lineShort(st, lineOf(id, st, ti))}</span><b class="mono">${c.n}/${c.N}</b></span>${meter(c.pct)}</span>`;
}

/* Expanded view of one stat for one team. ctx is set for team stats; players share one line, passed as fixed. */
function detail(id, st, ti, ctx, fixed) {
  const count = isCount(st), line = fixed !== undefined ? fixed : lineOf(id, st, ti), c = rate(st, ti, line), on = sel(ti), gs = T[ti].games;
  if (ctx && count) REG[id] = { st, ti };
  let hint = (count ? lineName(st, line) + ' landed' : st.mode === 'form' ? 'Won' : 'Happened') + ` in ${c.n} of ${c.N} selected games and ${c.n5} of the last ${c.N5}.`;
  if (count && st.opp && ctx && c.N) {
    const lean = st.opp / avg(c.v);
    if (lean >= 1.05) hint += ` ${ctx.opp} give up more of these than ${ctx.team} usually get, which leans towards the over.`;
    if (lean <= 0.95) hint += ` ${ctx.opp} give up fewer of these than ${ctx.team} usually get, which leans towards the under.`;
  }
  const kv = (k, v) => `<div class="kv"><span class="mu">${k}</span><span class="mono">${v.toFixed(1)}</span></div>`;
  return `<div style="display:flex;flex-direction:column;gap:8px">`
    + (ctx ? `<div class="kv" style="align-items:center"><b>${ctx.team}</b>${count && !W.matches ? stepper(id, st, line) : ''}</div>` : '')
    + `<div class="chips mono">${st.vals.map((v, i) => `<i class="${!on.includes(i) ? 'x' : c.f(v) ? 'y' : ''}" title="${gs[i].date} ${gs[i].ha === 'H' ? 'v' : '@'} ${gs[i].opp} (${gs[i].comp})">${st.mode === 'yn' ? (v ? 'Y' : 'N') : v}</i>`).join('')}</div>`
    + (count ? kv('Average, selected games', avg(c.v)) + (ctx && st.venue ? kv(ctx.home ? 'At home, per game' : 'Away, per game', st.venue) : '') + (ctx && st.opp ? kv(`${ctx.opp} allow, per game`, st.opp) : '') : '')
    + `<div class="box">${hint}</div></div>`;
}

/* Desktop cell: line buttons, last 5 and average sit inline. */
function wcell(id, st, ti) {
  const count = isCount(st), line = lineOf(id, st, ti), c = rate(st, ti, line);
  if (count) REG[id] = { st, ti };
  return `<div class="cell ${c.hot ? 'hot' : ''}"><span class="t">${count ? stepper(id, st, line) : `<span class="mu">${lineShort(st, line)}</span>`}`
    + `<span class="sm mu mono">${count ? avg(c.v).toFixed(1) + ' avg' : ''}</span><span class="sm mu mono">L5 ${c.n5}/${c.N5}</span><b class="mono">${c.n}/${c.N}</b></span>${meter(c.pct)}</div>`;
}

function teamRow(gi, si) {
  const id = `t${gi}.${si}`, open = !!S.open[id], sts = [0, 1].map(ti => T[ti].groups[gi].stats[si]);
  const toggle = inner => `<button class="rh" data-a="open" data-id="${id}" aria-expanded="${open}"><span class="lab">${chev(open)}${sts[0].label}</span>${inner}</button>`;
  return `<div class="row">` + (W.matches
      ? `<div class="wrow">${toggle('')}${sts.map((st, ti) => wcell(`${id}.${ti}`, st, ti)).join('')}</div>`
      : toggle(`<span class="cells">${sts.map((st, ti) => cell(`${id}.${ti}`, st, ti)).join('')}</span>`))
    + (open ? `<div class="det fade">${LEGEND}<div class="pair">${sts.map((st, ti) => detail(`${id}.${ti}`, st, ti, { team: T[ti].name, opp: T[1 - ti].name, home: ti === 0 })).join('')}</div></div>` : '') + `</div>`;
}

function marketTab(name) {
  const gi = T[0].groups.findIndex(g => g.name === name), stats = T[0].groups[gi].stats, more = !!S.more[name];
  const hidden = stats.filter(s => !s.core).length;
  return `<div class="card" style="padding-top:4px">${W.matches ? `<div class="wrow whd px mu"><span>Stat</span><span>${T[0].name}</span><span>${T[1].name}</span></div>` : ''}${stats.map((st, si) => more || st.core ? teamRow(gi, si) : '').join('')}`
    + (hidden ? `<button data-a="more" data-id="${name}" style="margin-top:8px;font-weight:600;font-size:14px">${more ? 'Show fewer' : `Show ${hidden} more`}</button>` : '') + `</div>`
    + (name === 'Cards' ? `<div class="card"><h2>Referee</h2><div>${DATA.fixture.refLine}</div></div>` : '');
}

/* Players: pick a stat, every player ranked at one shared line. */
function playersTab() {
  const key = S.pstat, id = 'p.' + key, rows = [];
  T.forEach((t, ti) => t.players.forEach((p, pi) => rows.push({ p, ti, pi, st: p.stats.find(s => s.key === key) })));
  const st0 = rows[0].st, count = isCount(st0), line = count ? (S.lines[id] ?? 1) : null;
  REG[id] = { st: { mode: st0.mode, vals: rows.flatMap(r => r.st.vals) }, ti: null };
  rows.forEach(r => { r.c = rate(r.st, r.ti, line); r.a = avg(r.c.v); });
  rows.sort((a, b) => b.c.n / (b.c.N || 1) - a.c.n / (a.c.N || 1) || b.a - a.a);
  return `<div class="pills" data-k="pstat">${T[0].players[0].stats.map(s => `<button data-a="pstat" data-id="${s.key}" class="${s.key === key ? 'on' : ''}">${s.label}</button>`).join('')}</div>`
    + `<div class="card" style="padding-top:4px"><div class="kv" style="align-items:center;padding:8px 0"><span>${count ? 'Line for every player' : 'Counts as a hit if it happened'}</span>${count ? stepper(id, st0, line) : ''}</div>`
    + (W.matches ? `<div class="prow whd px mu"><span>Player</span><span>Team</span><span class="r">Avg</span><span class="r">L5</span><span>Hits</span><span class="r">Mins</span></div>` : '')
    + rows.map(r => {
      const rid = `p${r.ti}.${r.pi}.${key}`, open = !!S.open[rid], tag = `${T[r.ti].code} · ${r.p.pos}`;
      return `<div class="row"><button class="rh ${W.matches ? 'prow' : ''} ${r.c.hot ? 'hot' : ''}" data-a="open" data-id="${rid}" aria-expanded="${open}">` + (W.matches
          ? `<span class="lab">${chev(open)}${r.p.name}</span><span class="sm mu">${tag}</span><span class="mono r">${count ? r.a.toFixed(1) : '-'}</span><span class="mono r">${r.c.n5}/${r.c.N5}</span><span class="hits"><b class="mono">${r.c.n}/${r.c.N}</b>${meter(r.c.pct)}</span><span class="mono r mu">${r.p.mins}</span>`
          : `<span class="lab">${chev(open)}<span style="flex:1">${r.p.name} <span class="mu sm" style="font-weight:400">${tag}</span></span><b class="mono">${r.c.n}/${r.c.N}</b></span>${meter(r.c.pct)}`) + `</button>`
        + (open ? `<div class="det fade">${LEGEND}${detail(rid, r.st, r.ti, null, line)}<div class="sm mu">${r.p.mins} minutes a game · started ${r.p.starts} of the last 10</div></div>` : '') + `</div>`;
    }).join('') + `</div>`;
}

const notesTab = () => `<div class="mu">Recent changes in roles, shape and partnerships that the 10-game numbers can hide.</div><div class="notes">`
  + DATA.notes.map(n => `<div class="card" style="gap:8px"><span class="px" style="align-self:flex-start;padding:2px 8px;background:var(--y);color:var(--bg)">${n.tag}</span><h2>${n.title}</h2><div>${n.body}</div><div class="box"><div class="px mu">Lines this touches</div>${n.touch}</div></div>`).join('') + `</div>`;

/* Games filter: leave out a competition or single games from every hit rate. */
const gamesBtn = () => `<button data-a="filt" data-id="f" aria-expanded="${S.filt}" style="display:flex;justify-content:space-between;align-items:center;font-size:14px"><span>Games used: <b class="mono">${sel(0).length + sel(1).length}/20</b>${Object.values(S.off).some(Boolean) || Object.values(S.comp).some(Boolean) ? ' · filtered' : ' · all'}</span>${chev(S.filt)}</button>`;
function gamesPanel() {
  const comps = [...new Set(T.flatMap(t => t.games.map(g => g.comp)))];
  return `<div class="card fade" style="gap:12px"><div class="sm mu">Leave out a competition or a single game, such as a freak result or a cup tie against a weak side. Every hit rate updates.</div>`
    + `<div class="pills" style="flex-wrap:wrap;margin:0;padding:0">${comps.map(c => `<button data-a="comp" data-id="${c}" class="${S.comp[c] ? '' : 'on'}" aria-pressed="${!S.comp[c]}">${c}</button>`).join('')}</div>`
    + T.map((t, ti) => `<div><div class="px mu">${t.name}, newest first</div>` + t.games.map((g, i) => [g, i]).reverse().map(([g, i]) => {
      const out = S.off[ti + '.' + i] || S.comp[g.comp];
      return `<button class="gm ${out ? 'x' : ''}" data-a="game" data-id="${ti}.${i}" aria-pressed="${!out}"><span>${g.date} · ${g.ha === 'H' ? 'v' : '@'} ${g.opp}</span><span class="mono">${g.score} · ${g.comp}</span></button>`;
    }).join('') + `</div>`).join('')
    + `<button data-a="reset" data-id="r">Use all games</button></div>`;
}

/* Strongest lines: for each stat, the highest line near its average that landed in 80%+ of selected games and 4 of the last 5. */
function strongest() {
  const out = [];
  const best = (st, ti) => { const b = baseLine(st, pick(st, ti)); return [b + 1, b, b - 1].filter(l => l > 0).map(l => ({ l, ...rate(st, ti, l) })).find(x => x.hot); };
  T.forEach((t, ti) => {
    t.groups.forEach(g => g.stats.filter(st => st.opp).forEach(st => { const b = best(st, ti); if (b) out.push({ who: t.name, text: `${t.name}: ${lineName(st, b.l).toLowerCase()} ${st.label.toLowerCase()}`, ...b, team: 1 }); }));
    t.players.forEach(p => p.stats.filter(st => st.core && isCount(st)).forEach(st => { const b = best(st, ti); if (b) out.push({ who: p.name, text: `${p.name} ${lineName(st, b.l)} ${st.label.toLowerCase()}`, ...b, team: 0 }); }));
  });
  const seen = {}, by = (a, b) => b.n / b.N - a.n / a.N || b.n5 - a.n5;
  return out.sort((a, b) => a.team - b.team || by(a, b)).filter(x => !seen[x.who] && (seen[x.who] = 1)).slice(0, 6).sort(by);
}

function render() {
  const f = DATA.fixture, top = strongest(), app = document.getElementById('app');
  const sx = {}; app.querySelectorAll('.pills[data-k]').forEach(p => sx[p.dataset.k] = p.scrollLeft);
  const fo = { ...(document.activeElement?.dataset || {}) };
  const head = `<div class="note">Prototype. Every number on this page is a sample, not real data.</div>
     <div class="px" style="font-size:22px;letter-spacing:.04em;font-weight:700">PIXEL<span style="color:var(--y)">TIPSTER</span></div>
     <div><div class="px mu">${f.meta}</div><h1>${f.name}</h1></div>
     <div class="card" style="border-color:var(--g)"><h2 style="padding-bottom:4px">Strongest lines</h2>
       ${top.length ? top.map(x => `<div class="kv" style="padding:8px 0;border-top:2px solid var(--s2);font-size:15px"><span>${x.text}</span><span class="mono g" style="flex:none">${x.n}/${x.N}</span></div>`).join('') : `<div class="mu sm">No line landed in 80% of the selected games.</div>`}
       <div class="sm mu" style="padding-top:6px">Landed in at least 80% of the selected games and 4 of the last 5.</div></div>`;
  const tabs = `<div class="pills" data-k="tabs">${TABS.map(t => `<button data-a="tab" data-id="${t}" class="${S.tab === t ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  const body = (S.tab === 'Trends' ? notesTab() : S.tab === 'Players' ? playersTab() : marketTab(S.tab))
    + `<div class="sm mu">${W.matches ? 'Click' : 'Tap'} any stat for the game-by-game numbers${W.matches ? '' : ' and to move the line'}. Hit rates describe past games. They are not predictions or a promise of profit. 18+.</div>`;
  app.className = W.matches ? 'wide' : '';
  app.innerHTML = W.matches
    ? `<aside class="side">${head}<h2>Games used <span class="mono">${sel(0).length + sel(1).length}/20</span></h2>${gamesPanel()}</aside><main><div class="top">${tabs}</div>${body}</main>`
    : `${head}<div class="top">${tabs}${S.tab === 'Trends' ? '' : gamesBtn()}</div>${S.tab !== 'Trends' && S.filt ? gamesPanel() : ''}${body}`;
  app.querySelectorAll('.pills[data-k]').forEach(p => p.scrollLeft = sx[p.dataset.k] || 0);
  if (fo.a) app.querySelector(`[data-a="${fo.a}"][data-id="${fo.id}"]${fo.d ? `[data-d="${fo.d}"]` : ''}`)?.focus({ preventScroll: true });
}

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const { a, id, d } = b.dataset;
  if (a === 'tab') S.tab = id;
  if (a === 'pstat') S.pstat = id;
  if (a === 'open') S.open[id] = !S.open[id];
  if (a === 'more') S.more[id] = !S.more[id];
  if (a === 'filt') S.filt = !S.filt;
  if (a === 'comp') S.comp[id] = !S.comp[id];
  if (a === 'game') S.off[id] = !S.off[id];
  if (a === 'reset') { S.off = {}; S.comp = {}; }
  if (a === 'line') {
    const { st, ti } = REG[id], step = st.mode === 'over' ? 0.5 : 1, max = Math.max(...st.vals) + step;
